name: Validate grade calculator
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --test tests/*.test.mjs
      - name: Build and smoke test C CLI
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic grade_calculator.c -o grade-calculator
          printf '3\n2\n80\n80\nn\n' | ./grade-calculator | grep '5.00 / 5.00'
